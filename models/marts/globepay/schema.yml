version: 2

models:
  - name: fct_globepay__transactions
    description: One row per Globepay card payment attempt. Every transaction is kept even when chargeback data is missing.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_globepay__acceptance_report')
    columns:
      - name: transaction_id
        description: Globepay transaction reference. Primary key.
        data_tests:
          - unique
          - not_null

      - name: globepay_reference_id
        description: Globepay reference id (`evt_…`).

      - name: transaction_ts
        description: Transaction timestamp, UTC.
        data_tests:
          - not_null

      - name: transaction_date
        description: UTC date of `transaction_ts`. Use for daily/monthly grouping.
        data_tests:
          - not_null

      - name: transaction_state
        description: Outcome of the payment attempt, ACCEPTED or DECLINED.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'DECLINED']

      - name: is_cvv_provided
        description: Whether the card CVV was supplied.

      - name: country_code
        description: Two-letter country code as sent by Globepay.

      - name: currency_code
        description: Currency of `amount_local`.

      - name: amount_local
        description: Amount in local currency.

      - name: fx_rate_to_usd
        description: Units of `currency_code` per 1 USD at the time of the transaction.
        data_tests:
          - not_null

      - name: amount_usd
        description: Amount converted to USD (`amount_local / fx_rate_to_usd`). Use for any cross-country totals.
        data_tests:
          - not_null

      - name: is_chargeback
        description: Whether the transaction was charged back. Null means the transaction has no record in the chargeback report.
