version: 2

models:
  - name: stg_globepay__acceptance_report
    description: One row per Globepay card payment attempt. Drops `status` and `source` since they're always the same value.
    columns:
      - name: transaction_id
        description: Primary key. Raw `external_ref`.
        data_tests:
          - unique
          - not_null

      - name: globepay_reference_id
        description: Globepay reference id. Raw `ref` (`evt_…`).

      - name: transaction_ts
        description: Transaction timestamp, UTC.

      - name: transaction_state
        description: ACCEPTED or DECLINED.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'DECLINED']

      - name: is_cvv_provided
        description: Whether the card CVV was supplied.

      - name: country_code
        description: Country code as sent by Globepay. Uses UK, not GB.

      - name: currency_code
        description: Currency of `amount_local`.

      - name: amount_local
        description: Amount in local currency, e.g. 1020.46. The API spec says minor units but the data is in major units.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn

      - name: fx_rate_to_usd
        description: Rate for `currency_code` per 1 USD, taken from the `rates` JSON on each row.
        data_tests:
          - not_null

      - name: amount_usd
        description: "`amount_local / fx_rate_to_usd`, rounded to cents."
        data_tests:
          - not_null

  - name: stg_globepay__chargeback_report
    description: One row per transaction with its chargeback flag. Drops `status` and `source` since they're always the same value.
    columns:
      - name: transaction_id
        description: Primary key. Raw `external_ref`.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_globepay__acceptance_report')
                field: transaction_id

      - name: is_chargeback
        description: Whether the transaction was charged back. Never null here, so a null in the fact table means the record is missing.
        data_tests:
          - not_null
