version: 2

models:
  - name: stg_globepay__acceptance_report
    description: >
      One row per card payment attempt processed by Globepay. Raw `status`
      (always TRUE) and `source` (always 'GLOBALPAY') are dropped because they
      carry no information.
    columns:
      - name: transaction_id
        description: Globepay transaction reference (raw `external_ref`). Primary key.
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: Processor event id (raw `ref`, `evt_…`).

      - name: transaction_ts
        description: Transaction timestamp, UTC.

      - name: transaction_state
        description: Outcome of the payment attempt.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'DECLINED']

      - name: is_accepted
        description: True when `transaction_state` is ACCEPTED.

      - name: is_cvv_provided
        description: Whether the card CVV was supplied.

      - name: country_code
        description: Two-letter country code as sent by Globepay. Uses 'UK' rather than ISO-3166 'GB'.

      - name: currency_code
        description: ISO-4217 currency of `amount_local`.

      - name: amount_local
        description: >
          Amount in local currency, major units (e.g. 1020.46). The API spec says
          minor units, but the data does not support that.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn

      - name: fx_rate_to_usd
        description: >
          Units of `currency_code` per 1 USD, taken from the raw `rates` JSON
          snapshot attached to the transaction. Null would mean the currency is
          missing from the snapshot.
        data_tests:
          - not_null

      - name: amount_usd
        description: "`amount_local / fx_rate_to_usd`, rounded to cents."
        data_tests:
          - not_null

  - name: stg_globepay__chargeback_report
    description: >
      Chargeback outcome per transaction. Raw `status` and `source` are dropped
      because they are constant.
    columns:
      - name: transaction_id
        description: Globepay transaction reference (raw `external_ref`). Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_globepay__acceptance_report')
                field: transaction_id

      - name: is_chargeback
        description: Whether the transaction was charged back.
